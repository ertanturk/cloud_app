name: Security Audit

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    schedule:
        - cron: "0 8 * * 1"

jobs:
    audit:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v6

            - name: Install uv
              uses: astral-sh/setup-uv@v3
              with:
                  version: "0.13.7"
                  enable-cache: true

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.12"

            - name: Run Dependency Audit
              run: |
                  uv run pip-audit
