[project]
name = "cloud-backend"
version = "0.1.0"
description = "Cloud Store API Server and Background Workers"
authors = [{ name = "Ertan Tunç Türk", email = "turke@mef.edu.tr" }]
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "psutil>=7.2.2",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "pymssql>=2.4.6",
    "pyotp>=2.10.0",
    "sqlalchemy>=2.1.8",
    "sse-starlette>=3.6.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
