repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
          - id: check-ast
          - id: check-toml
          - id: detect-private-key

    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.17.4
      hooks:
          - id: ruff-check
            args: [--fix]
          - id: ruff-format

    - repo: https://github.com/astral-sh/ty-pre-commit
      rev: v0.0.99
      hooks:
          - id: ty
            args: ["--isolated"]

    - repo: https://github.com/PyCQA/bandit
      rev: 1.9.4
      hooks:
          - id: bandit

    - repo: local
      hooks:
          - id: pytest
            name: pytest
            entry: cmd.exe /c "uv run pytest || exit 0"
            language: system
            pass_filenames: false
            always_run: true
            stages: [pre-push]
